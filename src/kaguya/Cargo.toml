[package]
name = "kaguya"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader="0.9"
x86_64 = {
  version = "0.14", default-features=false, features = ["instructions","abi_x86_interrupt"]
}
spin = "0.9"
pc-keyboard = "0.7.0"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}"]
